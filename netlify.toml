[build]
  command = "VITE_COMMIT_REF=$COMMIT_REF npm run build"
  publish = "dist"

[build.environment]
  # Playwright ne sert qu'aux tests : pas de téléchargement de navigateurs au build.
  PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD = "1"

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

[[headers]]
  for = "/sw.js"
  [headers.values]
    Cache-Control = "no-cache"

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
